name: LLM Assistant CI

on:
push:
  branches:
  - master

pull_request:
  branches:
  - master

jobs:
test-and-build:
runs-on: ubuntu-latest

steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install Poetry
    run: pip install poetry

  - name: Install Dependencies
    run: poetry install

  - name: Test Router
    run: poetry run python tests/test_router.py

  - name: Test Agent
    run: poetry run python tests/test_agent.py

  - name: Test Conditional Agent
    run: poetry run python tests/test_conditional_agent.py

  - name: Build Docker Image
    run: docker build -t llm-assistant-api .
